{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ledger{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Ledger</a>
    <div class="d-flex align-items-center gap-3">
      {% if user.is_authenticated %}
        <span class="navbar-text">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="d-flex mb-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
        </form>
      {% else %}
        <a class="nav-link text-light" href="{% url 'login' %}">Log in</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
