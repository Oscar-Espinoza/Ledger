{% extends "base.html" %}
{% block title %}New group — Ledger{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 card-title">New group</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form.as_div }}
          <button type="submit" class="btn btn-primary mt-2">Create group</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
